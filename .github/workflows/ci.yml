name: CI

on:
  push:
    branches: [main]
  pull_request:

# El workflow solo lee el código: no puede escribir en el repo ni publicar paquetes.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    # Postgres real para los tests de integración de los stores.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem
          POSTGRES_DB: siem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siem -d siem_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://siem:siem@localhost:5432/siem_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -race detecta accesos concurrentes sin sincronizar (workers, notificador, rate limiter).
      - run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Solo comprueba que la imagen compila; publicarla queda para el despliegue (fase 7).
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mini-siem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
