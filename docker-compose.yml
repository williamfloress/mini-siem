services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: siem
    ports:
      - "5433:5432"  # 5433 en el host: evita chocar con un Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
